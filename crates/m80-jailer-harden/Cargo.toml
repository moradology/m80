[package]
name = "m80-jailer-harden"
publish.workspace = true
description = "Apply inherited process hardening before execing Firecracker's jailer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
no-systemd-launch = []

[[bin]]
name = "m80-jailer-harden"
path = "src/main.rs"
required-features = ["no-systemd-launch"]

[[test]]
name = "integration_root"
path = "tests/integration_root.rs"
required-features = ["no-systemd-launch"]

[[test]]
name = "version"
path = "tests/version.rs"
required-features = ["no-systemd-launch"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
caps.workspace = true
m80-close-range.workspace = true
nix.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
