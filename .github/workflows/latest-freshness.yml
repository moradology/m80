name: Latest freshness

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-freshness-public
  cancel-in-progress: false

env:
  FRESHNESS_DIR: /tmp/m80-latest-freshness
  FRESHNESS_PROOF: /tmp/m80-latest-freshness/m80-latest-freshness-proof.json
  FRESHNESS_DRIFT: /tmp/m80-latest-freshness/m80-latest-freshness-drift.json
  FRESHNESS_STDOUT: /tmp/m80-latest-freshness/m80-latest-freshness.stdout
  FRESHNESS_STDERR: /tmp/m80-latest-freshness/m80-latest-freshness.stderr

jobs:
  hostless-public-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare freshness evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$FRESHNESS_DIR"
          : > "$FRESHNESS_STDOUT"
          : > "$FRESHNESS_STDERR"
          python3 - "$FRESHNESS_DRIFT" <<'PY'
          import json
          import os
          import sys

          drift = {
              "schema_version": 1,
              "status": "failure",
              "failure_class": "verifier-schema-drift",
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "source": {
                  "kind": "file",
                  "value": ".github/workflows/latest-freshness.yml",
                  "snippet_id": None,
              },
              "resolved_latest_tag": None,
              "expected_stable_tag": None,
              "expected": {"asset": None, "digest": None, "value": None},
              "observed": {"status": "not_started", "digest": None, "value": None},
              "verifier_version": "freshness-drift-evidence.v1",
              "safe_stderr_excerpt": "freshness verifier did not run",
              "repair_command": "python3 scripts/verify-freshness-failure-policy.py",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(drift, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          python3 - "$FRESHNESS_PROOF" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          owner, _, repo = repository.partition("/")
          failure = {
              "class": "verifier-schema-drift",
              "message": "freshness verifier did not run",
              "repair_command": "python3 scripts/verify-freshness-failure-policy.py",
          }

          proof = {
              "schema_version": 1,
              "status": "not_started",
              "generated_at": generated_at,
              "published_at": generated_at,
              "freshness_network_bounded": True,
              "repository": repository,
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID") or None,
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW") or None,
                  "run_id": os.environ.get("GITHUB_RUN_ID") or None,
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT") or None,
                  "job": os.environ.get("GITHUB_JOB") or None,
              },
              "resolved_latest_tag": None,
              "resolved_tag": None,
              "public_command_inventory": {
                  "status": "unavailable",
                  "digest": None,
                  "count": 0,
                  "entries": [],
                  "error": "freshness verifier did not run",
              },
              "tag_agreement": {"status": "not_run"},
              "integrity_result": {"status": "not_run", "public_asset_count": 0, "assets": []},
              "fixture_install_result": {
                  "status": "not_run",
                  "reason": "freshness verifier did not run",
              },
              "failure_taxonomy": {
                  "status": "failure",
                  "known_classes": [],
                  "failure": failure,
              },
              "failure": failure,
              "substrate": {
                  "network_target": "public-github-release",
                  "auth_state": "unauthenticated-public-read",
                  "public_owner": owner,
                  "public_repo": repo,
                  "latest_source_mode": "unknown",
                  "guard_source_mode": "unknown",
                  "fixture_source": False,
                  "github_write_apis_available": False,
              },
              "fetch_policy": {
                  "connect_timeout_seconds": 10,
                  "max_time_seconds": 120,
                  "retry_count": 2,
                  "retry_delay_seconds": 1,
              },
              "checked_urls": [],
              "public_assets": [],
              "safety_floor": {
                  "schema_version": 1,
                  "published_at": generated_at,
                  "minimum_safe_tag": None,
                  "yanked_releases": [],
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(proof, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

      - uses: actions/checkout@v6

      - name: Run public latest freshness verifier
        run: |
          set -euo pipefail
          set +e
          python3 scripts/release_freshness.py \
            --docs-root . \
            --json \
            --proof-out "$FRESHNESS_PROOF" \
            > "$FRESHNESS_STDOUT" \
            2> "$FRESHNESS_STDERR"
          status="$?"
          set -e
          if [ "$status" -ne 0 ]; then
            should_write_failure_proof=0
            if [ ! -s "$FRESHNESS_PROOF" ]; then
              should_write_failure_proof=1
            elif grep -q '"status": "not_started"' "$FRESHNESS_PROOF"; then
              should_write_failure_proof=1
            fi
          fi
          if [ "${should_write_failure_proof:-0}" -eq 1 ]; then
            python3 - "$FRESHNESS_PROOF" "$status" "$FRESHNESS_STDERR" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          owner, _, repo = repository.partition("/")
          stderr = Path(sys.argv[3]).read_text(encoding="utf-8")
          failure = {
              "class": "verifier-schema-drift",
              "message": stderr[-4000:],
              "repair_command": "python3 scripts/verify-freshness-failure-policy.py",
          }
          proof = {
              "schema_version": 1,
              "status": "failure",
              "generated_at": generated_at,
              "published_at": generated_at,
              "freshness_network_bounded": True,
              "exit_status": int(sys.argv[2]),
              "repository": repository,
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID") or None,
              "workflow": {
                  "name": os.environ.get("GITHUB_WORKFLOW") or None,
                  "run_id": os.environ.get("GITHUB_RUN_ID") or None,
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT") or None,
                  "job": os.environ.get("GITHUB_JOB") or None,
              },
              "resolved_latest_tag": None,
              "resolved_tag": None,
              "public_command_inventory": {
                  "status": "unavailable",
                  "digest": None,
                  "count": 0,
                  "entries": [],
                  "error": "freshness verifier did not emit a proof before failing",
              },
              "tag_agreement": {"status": "not_run"},
              "integrity_result": {"status": "not_run", "public_asset_count": 0, "assets": []},
              "fixture_install_result": {
                  "status": "not_run",
                  "reason": "freshness verifier failed before hostless fixture install",
              },
              "failure_taxonomy": {
                  "status": "failure",
                  "known_classes": [],
                  "failure": failure,
              },
              "failure": failure,
              "substrate": {
                  "network_target": "public-github-release",
                  "auth_state": "unauthenticated-public-read",
                  "public_owner": owner,
                  "public_repo": repo,
                  "latest_source_mode": "unknown",
                  "guard_source_mode": "unknown",
                  "fixture_source": False,
                  "github_write_apis_available": False,
              },
              "fetch_policy": {
                  "connect_timeout_seconds": 10,
                  "max_time_seconds": 120,
                  "retry_count": 2,
                  "retry_delay_seconds": 1,
              },
              "checked_urls": [],
              "public_assets": [],
              "safety_floor": {
                  "schema_version": 1,
                  "published_at": generated_at,
                  "minimum_safe_tag": None,
                  "yanked_releases": [],
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(proof, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          fi
          python3 scripts/release_freshness.py --validate-proof "$FRESHNESS_PROOF"
          python3 scripts/freshness_drift_evidence.py \
            --stderr-file "$FRESHNESS_STDERR" \
            --stdout-file "$FRESHNESS_STDOUT" \
            --exit-status "$status" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output "$FRESHNESS_DRIFT"
          python3 scripts/freshness_drift_evidence.py --validate "$FRESHNESS_DRIFT"
          cat "$FRESHNESS_STDOUT"
          cat "$FRESHNESS_STDERR" >&2
          exit "$status"

      - name: Upload latest freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m80-latest-freshness-${{ github.run_id }}
          path: |
            /tmp/m80-latest-freshness/m80-latest-freshness-proof.json
            /tmp/m80-latest-freshness/m80-latest-freshness-drift.json
            /tmp/m80-latest-freshness/m80-latest-freshness.stdout
            /tmp/m80-latest-freshness/m80-latest-freshness.stderr
          if-no-files-found: error
