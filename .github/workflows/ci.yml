name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install host test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y erofs-utils shellcheck
          shellcheck --version

      - name: workflow policy lint
        run: python3 scripts/lint-github-workflows.py

      - name: workflow syntax lint
        run: python3 scripts/run-actionlint.py --workflow-dir .github/workflows

      - name: release script tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/release_url_contract.py scripts/quickstart_snippets.py scripts/render-release-install-snippets.py scripts/test-release-url-contract.py scripts/stable_release_channel.py scripts/test-stable-release-channel.py scripts/stable_latest_bootstrap.py scripts/test-stable-latest-bootstrap.py scripts/freshness_proof.py scripts/release_freshness.py scripts/test-release-freshness.py scripts/freshness_status.py scripts/verify-freshness-status.py scripts/freshness_status_render.py scripts/render-freshness-status.py scripts/update-freshness-status-from-public-access.py scripts/test-freshness-status.py scripts/test-freshness-status-render.py scripts/test-update-freshness-status-from-public-access.py scripts/freshness_failure_policy.py scripts/verify-freshness-failure-policy.py scripts/test-freshness-failure-policy.py scripts/freshness_drift_evidence.py scripts/test-freshness-drift-evidence.py scripts/current_latest_repair_preflight.py scripts/test-current-latest-repair-preflight.py scripts/lint-github-workflows.py scripts/release_publish_authority.py scripts/test-workflow-policy.py scripts/run-actionlint.py scripts/test-actionlint-runner.py scripts/test-actionlint-fixtures.py scripts/verify-quickstart-proof.py scripts/write-quickstart-proof-fixture.py scripts/release_proof_ledger.py scripts/test-release-proof-ledger.py scripts/test-quickstart-proof.py scripts/verify-release-tracker-policy.py scripts/test-release-tracker-policy.py scripts/verify-release-readiness-config.py scripts/test-release-readiness-config.py scripts/package-release-bundle.py scripts/release_upload_manifest.py scripts/release_publish_receipt.py scripts/release_publication_plan.py scripts/test-release-publication-plan.py scripts/release_remote_asset_inventory.py scripts/release_public_access_receipt.py scripts/test-release-public-access-receipt.py scripts/release_evidence_bundle.py scripts/test-release-bundle.py scripts/verify-release-bundle.py scripts/verify-release-integrity.py scripts/verify-install-handoff.py scripts/test-install-handoff.py scripts/write-release-attestation-metadata.py scripts/verify-quickstart-troubleshooting.py scripts/render-quickstart-troubleshooting.py scripts/write-quickstart-troubleshooting-coverage.py scripts/test-quickstart-troubleshooting.py
          python3 scripts/test-release-url-contract.py
          python3 scripts/test-stable-release-channel.py
          python3 scripts/test-stable-latest-bootstrap.py
          python3 scripts/test-release-freshness.py
          python3 scripts/test-freshness-status.py
          python3 scripts/test-freshness-status-render.py
          python3 scripts/test-update-freshness-status-from-public-access.py
          python3 scripts/test-freshness-failure-policy.py
          python3 scripts/verify-freshness-failure-policy.py
          python3 scripts/test-freshness-drift-evidence.py
          python3 scripts/test-current-latest-repair-preflight.py
          python3 scripts/test-workflow-policy.py
          python3 scripts/test-actionlint-runner.py
          python3 scripts/test-actionlint-fixtures.py
          python3 scripts/test-release-proof-ledger.py
          python3 scripts/test-quickstart-proof.py
          python3 scripts/test-quickstart-troubleshooting.py
          python3 scripts/verify-quickstart-troubleshooting.py
          python3 scripts/render-quickstart-troubleshooting.py --check
          python3 scripts/write-quickstart-troubleshooting-coverage.py --check
          python3 scripts/test-release-tracker-policy.py
          python3 scripts/verify-release-tracker-policy.py --policy-config docs/behaviors/release/release-tracker-policy.json
          python3 scripts/test-release-readiness-config.py
          python3 scripts/verify-release-readiness-config.py
          python3 scripts/test-install-handoff.py
          python3 scripts/test-release-publication-plan.py
          python3 scripts/test-release-public-access-receipt.py
          python3 scripts/test-release-bundle.py

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal --component rustfmt --component clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      # `m80-guestd::exec_with_timeout_returns_timed_out` is a known timing
      # flake under heavy parallel test load (passes solo). `--test-threads=2`
      # keeps the load low enough that it doesn't trip in CI.
      - name: cargo test --workspace
        run: cargo test --workspace -- --test-threads=2

      - name: cargo test m80-attack-runner malicious artifact
        run: cargo test -p m80-attack-runner --features malicious-artifact -- --test-threads=2

      - name: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: ""
        run: cargo clippy --workspace --all-targets

      - name: cargo clippy m80-attack-runner malicious artifact
        run: cargo clippy -p m80-attack-runner --features malicious-artifact --all-targets -- -D warnings

      - name: install shell lint
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          shellcheck -s sh scripts/install.sh

      - name: shellcheck
        run: |
          set -euo pipefail
          find scripts -maxdepth 1 -name '*.sh' ! -name 'install.sh' -print0 | sort -z | xargs -0 shellcheck -s bash

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install audit toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Install cargo-audit
        run: cargo +1.85 install cargo-audit --version 0.22.1 --locked

      - name: cargo audit
        run: cargo +1.85 audit
