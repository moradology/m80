name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: workflow policy lint
        run: python3 scripts/lint-github-workflows.py

      - name: release script tests
        run: |
          python3 -m py_compile scripts/release_url_contract.py scripts/render-release-install-snippets.py scripts/test-release-url-contract.py scripts/package-release-bundle.py scripts/test-release-bundle.py scripts/verify-release-bundle.py scripts/verify-release-integrity.py scripts/write-release-attestation-metadata.py
          python3 scripts/test-release-url-contract.py
          python3 scripts/test-release-bundle.py

      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils shellcheck

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal --component rustfmt --component clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      # `m80-guestd::exec_with_timeout_returns_timed_out` is a known timing
      # flake under heavy parallel test load (passes solo). `--test-threads=2`
      # keeps the load low enough that it doesn't trip in CI.
      - name: cargo test --workspace
        run: cargo test --workspace -- --test-threads=2

      - name: cargo test m80-attack-runner malicious artifact
        run: cargo test -p m80-attack-runner --features malicious-artifact -- --test-threads=2

      - name: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: ""
        run: cargo clippy --workspace --all-targets

      - name: cargo clippy m80-attack-runner malicious artifact
        run: cargo clippy -p m80-attack-runner --features malicious-artifact --all-targets -- -D warnings

      - name: shellcheck
        run: shellcheck -s bash scripts/*.sh

  audit:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install audit toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Install cargo-audit
        run: cargo +1.85 install cargo-audit --version 0.22.1 --locked

      - name: cargo audit
        run: cargo +1.85 audit
