name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ARTIFACT_DIR: /tmp/m80-release-artifacts
  DIST_DIR: /tmp/m80-release-dist
  ARTIFACT_NAME: m80-release-dist

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_commit: ${{ steps.release-commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal

      - name: Install musl Rust target for pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl --toolchain 1.82

      - name: Install image-build host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox-static musl-tools e2fsprogs curl
          mkdir -p "$ARTIFACT_DIR"
          dpkg-query -W -f='${Package}=${Version}\n' \
            busybox-static musl-tools e2fsprogs curl \
            | sort > "$ARTIFACT_DIR/apt-package-versions.env"

      - name: Build m80 binaries
        run: |
          set -euo pipefail
          cargo build --locked -p m80-image-build --release
          cargo build --locked -p m80-guestd --release --target x86_64-unknown-linux-musl
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_commit="$(git rev-parse HEAD)"
            release_target_triple="$(rustc -vV | awk '/^host:/ {print $2}')"
            M80_RELEASE_TAG="$GITHUB_REF_NAME" \
              M80_RELEASE_COMMIT="$release_commit" \
              M80_RELEASE_TARGET_TRIPLE="$release_target_triple" \
              cargo build --locked -p m80-cli -p m80-jailer-harden -p m80-net-helper --release
          fi

      - name: Write minimal image config
        run: |
          set -euo pipefail
          cat > /tmp/m80-release-image.toml <<'EOF'
          [kernel]
          version = "v1.15.1"
          artifact_track = "v1.15"
          arch = "x86_64"

          [rootfs]
          kind = "minimal"
          size = "256MiB"

          [guestd]
          binary = "target/x86_64-unknown-linux-musl/release/m80-guestd"

          [output]
          dir = "/tmp/m80-release-artifacts"
          EOF

      - name: Build minimal rootfs artifacts
        run: |
          set -euo pipefail
          sudo -E target/release/m80-image-build run --config /tmp/m80-release-image.toml
          sudo chown -R "$USER:$USER" "$ARTIFACT_DIR"
          target/release/m80-image-build verify --rootfs "$ARTIFACT_DIR/output.ext4"

      - name: Resolve release commit
        id: release-commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          release_commit_sha="$(git rev-parse HEAD)"
          echo "sha=$release_commit_sha" >> "$GITHUB_OUTPUT"

      - name: Capture current latest release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if gh release view --json tagName,url > "$ARTIFACT_DIR/current-latest-release.json"; then
            :
          else
            printf '{}\n' > "$ARTIFACT_DIR/current-latest-release.json"
          fi

      - name: Preflight current latest repair target
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/current_latest_repair_preflight.py \
            --release-tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --latest-metadata "$ARTIFACT_DIR/current-latest-release.json" \
            --out "$ARTIFACT_DIR/m80-current-latest-repair-preflight.json"

      - name: Upload current latest repair preflight
        if: startsWith(github.ref, 'refs/tags/') && always()
        uses: actions/upload-artifact@v4
        with:
          name: m80-current-latest-repair-preflight-${{ github.run_id }}
          path: /tmp/m80-release-artifacts/m80-current-latest-repair-preflight.json
          if-no-files-found: error

      - name: Package release bundle and asset index
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          RUSTC_HOST_TRIPLE="$(rustc +1.82 -vV | awk '/^host:/ {print $2}')"
          package_args=()
          while IFS= read -r package_version; do
            package_args+=(--apt-package-version "$package_version")
          done < "$ARTIFACT_DIR/apt-package-versions.env"
          scripts/package-release-bundle.py \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --rust-toolchain 1.82 \
            --target-triple "$RUSTC_HOST_TRIPLE" \
            --target-triple x86_64-unknown-linux-musl \
            --builder-identity "github-actions:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --builder-os-image "${ImageOS:-unknown}:${ImageVersion:-unknown}" \
            "${package_args[@]}" \
            --target linux-x86_64 \
            --image-kind minimal \
            --m80-bin target/release/m80 \
            --jailer-harden-bin target/release/m80-jailer-harden \
            --net-helper-bin target/release/m80-net-helper \
            --kernel "$ARTIFACT_DIR/vmlinux" \
            --rootfs "$ARTIFACT_DIR/output.ext4" \
            --rootfs-manifest "$ARTIFACT_DIR/output.ext4.manifest.json" \
            --build-receipt "$ARTIFACT_DIR/output.ext4.build-receipt.json" \
            --guestd "$ARTIFACT_DIR/m80-guestd" \
            --install-sh scripts/install.sh \
            --out-dir "$DIST_DIR"

      - name: Prepare release integrity attestation subject
        id: integrity-subject
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          digest="$(sha256sum "$DIST_DIR/m80-release-integrity.json" | awk '{print $1}')"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"

      - name: Generate release integrity attestation
        id: attest-integrity
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-name: m80-release-integrity.json
          subject-digest: ${{ steps.integrity-subject.outputs.digest }}
          show-summary: false

      - name: Capture release integrity attestation metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest-integrity.outputs.bundle-path }}" \
            "$DIST_DIR/m80-release-integrity.attestation.jsonl"
          python3 scripts/write-release-attestation-metadata.py \
            --material "$DIST_DIR/m80-release-integrity.json" \
            --attestation-bundle "$DIST_DIR/m80-release-integrity.attestation.jsonl" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --out "$DIST_DIR/m80-release-attestation.json"

      - name: Write and validate hostless quickstart proof artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          scripts/write-quickstart-proof-fixture.py \
            --release-tag "$GITHUB_REF_NAME" \
            --artifact-root "$DIST_DIR" \
            --bundle-metadata "$DIST_DIR/m80-linux-x86_64.bundle.json" \
            --out "$DIST_DIR/m80-quickstart-proof-hostless.json"
          scripts/verify-quickstart-proof.py \
            "$DIST_DIR/m80-quickstart-proof-hostless.json" \
            --artifact-root "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --result-out "$DIST_DIR/m80-quickstart-proof-hostless.verifier-result.json"
          scripts/release_proof_ledger.py append \
            --ledger "$DIST_DIR/m80-release-proof-ledger.jsonl" \
            --artifact-root "$DIST_DIR" \
            --proof "$DIST_DIR/m80-quickstart-proof-hostless.json" \
            --verifier-result "$DIST_DIR/m80-quickstart-proof-hostless.verifier-result.json" \
            --log-artifact "$DIST_DIR/m80-quickstart-stderr.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-identity "github-actions:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --release-tag "$GITHUB_REF_NAME"
          scripts/release_proof_ledger.py verify \
            --ledger "$DIST_DIR/m80-release-proof-ledger.jsonl" \
            --artifact-root "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --require-proof m80-quickstart-proof-hostless.json \
            --require-proof-type hostless \
            --expect-record-count 1

      - name: Write and validate release upload manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          scripts/release_upload_manifest.py \
            --dist-dir "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --write

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/m80-release-dist/*

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-build-failure-${{ github.run_id }}
          path: |
            /tmp/m80-release-artifacts/**
            /tmp/m80-release-dist/**
          if-no-files-found: ignore

  publish-release-artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/m80-release-upload

      - name: Verify hostless quickstart proof artifact before upload
        run: |
          set -euo pipefail
          scripts/verify-quickstart-proof.py \
            /tmp/m80-release-upload/m80-quickstart-proof-hostless.json \
            --artifact-root /tmp/m80-release-upload \
            --release-tag "$GITHUB_REF_NAME"
          scripts/release_proof_ledger.py verify \
            --ledger /tmp/m80-release-upload/m80-release-proof-ledger.jsonl \
            --artifact-root /tmp/m80-release-upload \
            --release-tag "$GITHUB_REF_NAME" \
            --require-proof m80-quickstart-proof-hostless.json \
            --require-proof-type hostless \
            --expect-record-count 1

      - name: Verify release integrity material before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/verify-release-integrity.py \
            /tmp/m80-release-upload/m80-release-integrity.json \
            --dist-dir /tmp/m80-release-upload \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle /tmp/m80-release-upload/m80-release-integrity.attestation.jsonl \
            --attestation-metadata /tmp/m80-release-upload/m80-release-attestation.json \
            --verification-time "$verification_time" \
            --rust-toolchain 1.82

      - name: Verify release upload manifest before upload
        run: |
          set -euo pipefail
          scripts/release_upload_manifest.py \
            --dist-dir /tmp/m80-release-upload \
            --release-tag "$GITHUB_REF_NAME"

      - name: Verify publish authority before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          M80_RELEASE_TOKEN_SOURCE: github.token
        run: |
          set -euo pipefail
          scripts/release_publish_authority.py \
            --workflow-file .github/workflows/release-artifacts.yml \
            --token-source "$M80_RELEASE_TOKEN_SOURCE"

      - name: Write and validate publish decision receipt before upload
        env:
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_receipt.py \
            --dist-dir /tmp/m80-release-upload \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --write

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t upload_paths < <(
            scripts/release_upload_manifest.py \
              --dist-dir /tmp/m80-release-upload \
              --release-tag "$GITHUB_REF_NAME" \
              --print-upload-paths
          )
          gh release upload "$GITHUB_REF_NAME" "${upload_paths[@]}" --clobber

      - name: Re-download and validate published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p /tmp/m80-release-redownload
          download_args=(--dir /tmp/m80-release-redownload)
          while IFS= read -r pattern; do
            download_args+=(--pattern "$pattern")
          done < <(
            scripts/release_upload_manifest.py \
              --dist-dir /tmp/m80-release-upload \
              --release-tag "$GITHUB_REF_NAME" \
              --print-download-patterns
          )
          gh release download "$GITHUB_REF_NAME" "${download_args[@]}"
          scripts/release_upload_manifest.py \
            --dist-dir /tmp/m80-release-redownload \
            --manifest /tmp/m80-release-upload/m80-release-upload-manifest.json \
            --release-tag "$GITHUB_REF_NAME" \
            --require-exact-dist-public-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > /tmp/m80-release-redownload/github-release.json
          release_id="$(
            python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("/tmp/m80-release-redownload/github-release.json").read_text())["id"])
          PY
          )"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > /tmp/m80-release-redownload/github-release-assets.json
          scripts/release_remote_asset_inventory.py \
            --redownload-dir /tmp/m80-release-redownload \
            --manifest /tmp/m80-release-upload/m80-release-upload-manifest.json \
            --release-metadata /tmp/m80-release-redownload/github-release.json \
            --release-assets-metadata /tmp/m80-release-redownload/github-release-assets.json \
            --release-tag "$GITHUB_REF_NAME" \
            --write
          scripts/verify-install-handoff.py \
            /tmp/m80-release-redownload \
            --release-tag "$GITHUB_REF_NAME" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle /tmp/m80-release-redownload/m80-release-integrity.attestation.jsonl \
            --attestation-metadata /tmp/m80-release-redownload/m80-release-attestation.json \
            --verification-time "$verification_time"
          scripts/stable_release_channel.py \
            --release-metadata /tmp/m80-release-redownload/github-release.json \
            --asset-index /tmp/m80-release-redownload/m80-release-assets.json \
            --expected-tag "$GITHUB_REF_NAME"
          scripts/verify-release-bundle.py \
            /tmp/m80-release-redownload/m80-linux-x86_64.tar.gz \
            --release-tag "$GITHUB_REF_NAME" \
            --verify-sidecars
          scripts/verify-release-integrity.py \
            /tmp/m80-release-redownload/m80-release-integrity.json \
            --dist-dir /tmp/m80-release-redownload \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle /tmp/m80-release-redownload/m80-release-integrity.attestation.jsonl \
            --attestation-metadata /tmp/m80-release-redownload/m80-release-attestation.json \
            --verification-time "$verification_time" \
            --rust-toolchain 1.82

      - name: Upload publish decision receipt
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-publish-decision-${{ github.run_id }}
          path: /tmp/m80-release-upload/m80-release-publish-decision.json
          if-no-files-found: error

      - name: Upload remote release asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-remote-assets-${{ github.run_id }}
          path: /tmp/m80-release-redownload/m80-release-remote-assets.json
          if-no-files-found: error

      - name: Upload failed publish diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-publish-failure-${{ github.run_id }}
          path: |
            /tmp/m80-release-upload/**
            /tmp/m80-release-redownload/**
          if-no-files-found: ignore
