name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ARTIFACT_DIR: /tmp/m80-release-artifacts
  DIST_DIR: /tmp/m80-release-dist
  ARTIFACT_NAME: m80-release-dist

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal

      - name: Install musl Rust target for pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl --toolchain 1.82

      - name: Install image-build host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static musl-tools e2fsprogs curl

      - name: Build m80 binaries
        run: |
          cargo build -p m80-image-build --release
          cargo build -p m80-guestd --release --target x86_64-unknown-linux-musl
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            M80_RELEASE_TAG="$GITHUB_REF_NAME" cargo build -p m80-cli -p m80-jailer-harden -p m80-net-helper --release
          fi

      - name: Write minimal image config
        run: |
          cat > /tmp/m80-release-image.toml <<'EOF'
          [kernel]
          version = "v1.15.1"
          artifact_track = "v1.15"
          arch = "x86_64"

          [rootfs]
          kind = "minimal"
          size = "256MiB"

          [guestd]
          binary = "target/x86_64-unknown-linux-musl/release/m80-guestd"

          [output]
          dir = "/tmp/m80-release-artifacts"
          EOF

      - name: Build minimal rootfs artifacts
        run: |
          sudo -E target/release/m80-image-build run --config /tmp/m80-release-image.toml
          sudo chown -R "$USER:$USER" "$ARTIFACT_DIR"
          target/release/m80-image-build verify --rootfs "$ARTIFACT_DIR/output.ext4"

      - name: Package release bundle and asset index
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/package-release-bundle.py \
            --release-tag "$GITHUB_REF_NAME" \
            --target linux-x86_64 \
            --image-kind minimal \
            --m80-bin target/release/m80 \
            --jailer-harden-bin target/release/m80-jailer-harden \
            --net-helper-bin target/release/m80-net-helper \
            --kernel "$ARTIFACT_DIR/vmlinux" \
            --rootfs "$ARTIFACT_DIR/output.ext4" \
            --rootfs-manifest "$ARTIFACT_DIR/output.ext4.manifest.json" \
            --build-receipt "$ARTIFACT_DIR/output.ext4.build-receipt.json" \
            --guestd "$ARTIFACT_DIR/m80-guestd" \
            --install-sh scripts/install.sh \
            --out-dir "$DIST_DIR"

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/m80-release-dist/*

  publish-release-artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/m80-release-upload

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            /tmp/m80-release-upload/m80-linux-x86_64.tar.gz \
            /tmp/m80-release-upload/m80-linux-x86_64.tar.gz.sha256 \
            /tmp/m80-release-upload/m80-linux-x86_64.bundle.json \
            /tmp/m80-release-upload/m80-linux-x86_64.bundle.json.sha256 \
            /tmp/m80-release-upload/m80-release-assets.json \
            /tmp/m80-release-upload/m80-release-assets.json.sha256 \
            /tmp/m80-release-upload/install.sh \
            /tmp/m80-release-upload/install.sh.sha256 \
            /tmp/m80-release-upload/SHA256SUMS \
            --clobber

      - name: Re-download and validate published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m80-release-redownload
          gh release download "$GITHUB_REF_NAME" \
            --dir /tmp/m80-release-redownload \
            --pattern m80-linux-x86_64.tar.gz \
            --pattern m80-linux-x86_64.tar.gz.sha256 \
            --pattern m80-linux-x86_64.bundle.json \
            --pattern m80-linux-x86_64.bundle.json.sha256 \
            --pattern m80-release-assets.json \
            --pattern m80-release-assets.json.sha256 \
            --pattern install.sh \
            --pattern install.sh.sha256 \
            --pattern SHA256SUMS
          scripts/verify-release-bundle.py \
            /tmp/m80-release-redownload/m80-linux-x86_64.tar.gz \
            --release-tag "$GITHUB_REF_NAME" \
            --verify-sidecars
