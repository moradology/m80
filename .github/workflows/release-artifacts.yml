name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ARTIFACT_DIR: /tmp/m80-release-artifacts
  ARTIFACT_NAME: m80-linux-x86_64-minimal-artifacts

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal

      - name: Install musl Rust target for pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl --toolchain 1.82

      - name: Install image-build host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static musl-tools e2fsprogs curl

      - name: Build m80 binaries
        run: |
          cargo build -p m80-image-build --release
          cargo build -p m80-guestd --release --target x86_64-unknown-linux-musl

      - name: Write minimal image config
        run: |
          cat > /tmp/m80-release-image.toml <<'EOF'
          [kernel]
          version = "v1.15.1"
          artifact_track = "v1.15"
          arch = "x86_64"

          [rootfs]
          kind = "minimal"
          size = "256MiB"

          [guestd]
          binary = "target/x86_64-unknown-linux-musl/release/m80-guestd"

          [output]
          dir = "/tmp/m80-release-artifacts"
          EOF

      - name: Build minimal rootfs artifacts
        run: |
          sudo -E target/release/m80-image-build run --config /tmp/m80-release-image.toml
          sudo chown -R "$USER:$USER" "$ARTIFACT_DIR"
          target/release/m80-image-build verify --rootfs "$ARTIFACT_DIR/output.ext4"

      - name: Package tarball and checksums
        run: |
          cd "$ARTIFACT_DIR"
          sha256sum vmlinux output.ext4 output.ext4.manifest.json m80-guestd > SHA256SUMS
          tar -czf "/tmp/${ARTIFACT_NAME}.tar.gz" \
            vmlinux output.ext4 output.ext4.manifest.json m80-guestd SHA256SUMS
          cd /tmp
          sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/${{ env.ARTIFACT_NAME }}.tar.gz
            /tmp/${{ env.ARTIFACT_NAME }}.tar.gz.sha256

  publish-release-artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/m80-release-upload

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            /tmp/m80-release-upload/${ARTIFACT_NAME}.tar.gz \
            /tmp/m80-release-upload/${ARTIFACT_NAME}.tar.gz.sha256 \
            --clobber
