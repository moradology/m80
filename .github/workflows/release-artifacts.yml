name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ARTIFACT_NAME: m80-release-dist

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_commit: ${{ steps.release-commit.outputs.sha }}
      release_dist_artifact_id: ${{ steps.upload-release-dist.outputs.artifact-id }}
      release_dist_artifact_name: ${{ steps.release-artifact-origin.outputs.name }}
      release_dist_producer_job: ${{ steps.release-artifact-origin.outputs.producer_job }}
      release_tag: ${{ steps.release-artifact-origin.outputs.release_tag }}
      release_upload_manifest_digest: ${{ steps.release-upload-manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release build scratch dirs
        id: build-scratch
        run: |
          set -euo pipefail
          release_tmp_root="$RUNNER_TEMP/m80-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build"
          artifact_dir="$release_tmp_root/artifacts"
          dist_dir="$release_tmp_root/dist"
          image_config="$release_tmp_root/image.toml"
          test ! -e "$release_tmp_root"
          mkdir -p "$artifact_dir" "$dist_dir"
          chmod 700 "$release_tmp_root"
          test -d "$release_tmp_root"
          test ! -L "$release_tmp_root"
          owner_uid="$(stat -c '%u' "$release_tmp_root")"
          current_uid="$(id -u)"
          test "$owner_uid" = "$current_uid"
          mode_octal="$(stat -c '%a' "$release_tmp_root")"
          test "$mode_octal" = "700"
          {
            echo "RELEASE_TMP_ROOT=$release_tmp_root"
            echo "ARTIFACT_DIR=$artifact_dir"
            echo "DIST_DIR=$dist_dir"
            echo "IMAGE_CONFIG=$image_config"
          } >> "$GITHUB_ENV"
          {
            echo "release_tmp_root=$release_tmp_root"
            echo "artifact_dir=$artifact_dir"
            echo "dist_dir=$dist_dir"
            echo "image_config=$image_config"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal

      - name: Install musl Rust target for pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl --toolchain 1.82

      - name: Install image-build host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox-static musl-tools e2fsprogs curl
          mkdir -p "$ARTIFACT_DIR"
          dpkg-query -W -f='${Package}=${Version}\n' \
            busybox-static musl-tools e2fsprogs curl \
            | sort > "$ARTIFACT_DIR/apt-package-versions.env"

      - name: Build m80 binaries
        run: |
          set -euo pipefail
          cargo build --locked -p m80-image-build --release
          cargo build --locked -p m80-guestd --release --target x86_64-unknown-linux-musl
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_commit="$(git rev-parse HEAD)"
            release_target_triple="$(rustc -vV | awk '/^host:/ {print $2}')"
            M80_RELEASE_TAG="$GITHUB_REF_NAME" \
              M80_RELEASE_COMMIT="$release_commit" \
              M80_RELEASE_TARGET_TRIPLE="$release_target_triple" \
              cargo build --locked -p m80-cli -p m80-jailer-harden -p m80-net-helper --release
          fi

      - name: Write minimal image config
        run: |
          set -euo pipefail
          cat > "$IMAGE_CONFIG" <<'EOF'
          [kernel]
          version = "v1.15.1"
          artifact_track = "v1.15"
          arch = "x86_64"

          [rootfs]
          kind = "minimal"
          size = "256MiB"

          [guestd]
          binary = "target/x86_64-unknown-linux-musl/release/m80-guestd"

          [output]
          dir = "__ARTIFACT_DIR__"
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path(os.environ["IMAGE_CONFIG"])
          config.write_text(config.read_text().replace("__ARTIFACT_DIR__", os.environ["ARTIFACT_DIR"]))
          PY

      - name: Build minimal rootfs artifacts
        run: |
          set -euo pipefail
          sudo -E target/release/m80-image-build run --config "$IMAGE_CONFIG"
          sudo chown -R "$USER:$USER" "$ARTIFACT_DIR"
          target/release/m80-image-build verify --rootfs "$ARTIFACT_DIR/output.ext4"

      - name: Resolve release commit
        id: release-commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          release_commit_sha="$(git rev-parse HEAD)"
          echo "sha=$release_commit_sha" >> "$GITHUB_OUTPUT"

      - name: Capture current latest release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          if gh release view --json tagName,url > "$ARTIFACT_DIR/current-latest-release.json"; then
            :
          else
            printf '{}\n' > "$ARTIFACT_DIR/current-latest-release.json"
          fi

      - name: Preflight current latest repair target
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/current_latest_repair_preflight.py \
            --release-tag "$GITHUB_REF_NAME" \
            --source-commit "$RELEASE_COMMIT" \
            --latest-metadata "$ARTIFACT_DIR/current-latest-release.json" \
            --out "$ARTIFACT_DIR/m80-current-latest-repair-preflight.json"

      - name: Upload current latest repair preflight
        if: startsWith(github.ref, 'refs/tags/') && always()
        uses: actions/upload-artifact@v4
        with:
          name: m80-current-latest-repair-preflight-${{ github.run_id }}
          path: ${{ steps.build-scratch.outputs.artifact_dir }}/m80-current-latest-repair-preflight.json
          if-no-files-found: error

      - name: Package release bundle and asset index
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          RUSTC_HOST_TRIPLE="$(rustc +1.82 -vV | awk '/^host:/ {print $2}')"
          package_args=()
          while IFS= read -r package_version; do
            package_args+=(--apt-package-version "$package_version")
          done < "$ARTIFACT_DIR/apt-package-versions.env"
          scripts/package-release-bundle.py \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --rust-toolchain 1.82 \
            --target-triple "$RUSTC_HOST_TRIPLE" \
            --target-triple x86_64-unknown-linux-musl \
            --builder-identity "github-actions:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --builder-os-image "${ImageOS:-unknown}:${ImageVersion:-unknown}" \
            "${package_args[@]}" \
            --target linux-x86_64 \
            --image-kind minimal \
            --m80-bin target/release/m80 \
            --jailer-harden-bin target/release/m80-jailer-harden \
            --net-helper-bin target/release/m80-net-helper \
            --kernel "$ARTIFACT_DIR/vmlinux" \
            --rootfs "$ARTIFACT_DIR/output.ext4" \
            --rootfs-manifest "$ARTIFACT_DIR/output.ext4.manifest.json" \
            --build-receipt "$ARTIFACT_DIR/output.ext4.build-receipt.json" \
            --guestd "$ARTIFACT_DIR/m80-guestd" \
            --install-sh scripts/install.sh \
            --out-dir "$DIST_DIR"

      - name: Prepare release integrity attestation subject
        id: integrity-subject
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          digest="$(sha256sum "$DIST_DIR/m80-release-integrity.json" | awk '{print $1}')"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"

      - name: Generate release integrity attestation
        id: attest-integrity
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-name: m80-release-integrity.json
          subject-digest: ${{ steps.integrity-subject.outputs.digest }}
          show-summary: false

      - name: Capture release integrity attestation metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          cp "${{ steps.attest-integrity.outputs.bundle-path }}" \
            "$DIST_DIR/m80-release-integrity.attestation.jsonl"
          python3 scripts/write-release-attestation-metadata.py \
            --material "$DIST_DIR/m80-release-integrity.json" \
            --attestation-bundle "$DIST_DIR/m80-release-integrity.attestation.jsonl" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --out "$DIST_DIR/m80-release-attestation.json"

      - name: Write and validate hostless quickstart proof artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          scripts/write-quickstart-proof-fixture.py \
            --release-tag "$GITHUB_REF_NAME" \
            --artifact-root "$DIST_DIR" \
            --bundle-metadata "$DIST_DIR/m80-linux-x86_64.bundle.json" \
            --out "$DIST_DIR/m80-quickstart-proof-hostless.json"
          scripts/verify-quickstart-proof.py \
            "$DIST_DIR/m80-quickstart-proof-hostless.json" \
            --artifact-root "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --result-out "$DIST_DIR/m80-quickstart-proof-hostless.verifier-result.json"
          scripts/release_proof_ledger.py append \
            --ledger "$DIST_DIR/m80-release-proof-ledger.jsonl" \
            --artifact-root "$DIST_DIR" \
            --proof "$DIST_DIR/m80-quickstart-proof-hostless.json" \
            --verifier-result "$DIST_DIR/m80-quickstart-proof-hostless.verifier-result.json" \
            --log-artifact "$DIST_DIR/m80-quickstart-stderr.txt" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --runner-identity "github-actions:${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --release-tag "$GITHUB_REF_NAME"
          scripts/release_proof_ledger.py verify \
            --ledger "$DIST_DIR/m80-release-proof-ledger.jsonl" \
            --artifact-root "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --require-proof m80-quickstart-proof-hostless.json \
            --require-proof-type hostless \
            --expect-record-count 1

      - name: Write and validate release upload manifest
        id: release-upload-manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          scripts/release_upload_manifest.py \
            --dist-dir "$DIST_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --write
          digest="$(sha256sum "$DIST_DIR/m80-release-upload-manifest.json" | awk '{print $1}')"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        id: upload-release-dist
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.build-scratch.outputs.dist_dir }}/*

      - name: Record workflow artifact origin
        id: release-artifact-origin
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          {
            echo "name=$ARTIFACT_NAME"
            echo "producer_job=build-release-artifacts"
            echo "release_tag=$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-build-failure-${{ github.run_id }}
          path: |
            ${{ steps.build-scratch.outputs.artifact_dir }}/**
            ${{ steps.build-scratch.outputs.dist_dir }}/**
          if-no-files-found: ignore

      - name: Cleanup release build scratch dirs
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_TMP_ROOT"

  publish-release-artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Prepare release publish scratch dirs
        id: publish-scratch
        run: |
          set -euo pipefail
          release_tmp_root="$RUNNER_TEMP/m80-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish"
          upload_dir="$release_tmp_root/upload"
          prepublish_dir="$release_tmp_root/prepublish"
          redownload_dir="$release_tmp_root/redownload"
          noauth_gh_dir="$release_tmp_root/noauth-gh"
          test ! -e "$release_tmp_root"
          mkdir -p "$upload_dir" "$prepublish_dir" "$redownload_dir"
          chmod 700 "$release_tmp_root"
          test -d "$release_tmp_root"
          test ! -L "$release_tmp_root"
          owner_uid="$(stat -c '%u' "$release_tmp_root")"
          current_uid="$(id -u)"
          test "$owner_uid" = "$current_uid"
          mode_octal="$(stat -c '%a' "$release_tmp_root")"
          test "$mode_octal" = "700"
          {
            echo "RELEASE_TMP_ROOT=$release_tmp_root"
            echo "UPLOAD_DIR=$upload_dir"
            echo "PREPUBLISH_DIR=$prepublish_dir"
            echo "REDOWNLOAD_DIR=$redownload_dir"
            echo "NOAUTH_GH_DIR=$noauth_gh_dir"
          } >> "$GITHUB_ENV"
          {
            echo "release_tmp_root=$release_tmp_root"
            echo "upload_dir=$upload_dir"
            echo "prepublish_dir=$prepublish_dir"
            echo "redownload_dir=$redownload_dir"
            echo "noauth_gh_dir=$noauth_gh_dir"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-release-artifacts.outputs.release_dist_artifact_id }}
          path: ${{ steps.publish-scratch.outputs.upload_dir }}

      - name: Verify workflow artifact origin handoff
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build-release-artifacts.outputs.release_dist_artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.build-release-artifacts.outputs.release_dist_artifact_name }}
          EXPECTED_PRODUCER_JOB: ${{ needs.build-release-artifacts.outputs.release_dist_producer_job }}
          EXPECTED_RELEASE_TAG: ${{ needs.build-release-artifacts.outputs.release_tag }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.build-release-artifacts.outputs.release_upload_manifest_digest }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_ARTIFACT_ID"
          test "$EXPECTED_ARTIFACT_NAME" = "$ARTIFACT_NAME"
          test "$EXPECTED_PRODUCER_JOB" = "build-release-artifacts"
          test "$EXPECTED_RELEASE_TAG" = "$GITHUB_REF_NAME"
          test -n "$RELEASE_COMMIT"
          manifest_sha="$(sha256sum "$UPLOAD_DIR/m80-release-upload-manifest.json" | awk '{print $1}')"
          observed_digest="sha256:$manifest_sha"
          test "$observed_digest" = "$EXPECTED_MANIFEST_DIGEST"

      - name: Verify hostless quickstart proof artifact before upload
        run: |
          set -euo pipefail
          scripts/verify-quickstart-proof.py \
            "$UPLOAD_DIR/m80-quickstart-proof-hostless.json" \
            --artifact-root "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME"
          scripts/release_proof_ledger.py verify \
            --ledger "$UPLOAD_DIR/m80-release-proof-ledger.jsonl" \
            --artifact-root "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --require-proof m80-quickstart-proof-hostless.json \
            --require-proof-type hostless \
            --expect-record-count 1

      - name: Verify release integrity material before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          scripts/verify-release-integrity.py \
            "$UPLOAD_DIR/m80-release-integrity.json" \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle "$UPLOAD_DIR/m80-release-integrity.attestation.jsonl" \
            --attestation-metadata "$UPLOAD_DIR/m80-release-attestation.json" \
            --verification-time "$verification_time" \
            --rust-toolchain 1.82

      - name: Verify release upload manifest before upload
        run: |
          set -euo pipefail
          scripts/release_upload_manifest.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME"

      - name: Verify publish authority before mutation
        env:
          GH_TOKEN: ${{ github.token }}
          M80_RELEASE_TOKEN_SOURCE: github.token
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_authority.py \
            --workflow-file .github/workflows/release-artifacts.yml \
            --token-source "$M80_RELEASE_TOKEN_SOURCE" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --receipt "$UPLOAD_DIR/m80-release-token-authority.json" \
            --write

      - name: Write and validate publish decision receipt before upload
        env:
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_receipt.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --token-authority "$UPLOAD_DIR/m80-release-token-authority.json" \
            --write

      - name: Resolve release publication plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$UPLOAD_DIR/github-release-before-upload.json"
          stderr="$UPLOAD_DIR/github-release-before-upload.stderr"
          if gh release view "$GITHUB_REF_NAME" --json tagName,url,isDraft,isPrerelease,assets > "$metadata" 2> "$stderr"; then
            :
          elif grep -qi "release not found" "$stderr"; then
            printf '{}\n' > "$metadata"
          else
            cat "$stderr" >&2
            exit 1
          fi
          python3 scripts/release_publication_plan.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --release-metadata "$metadata" \
            --out "$UPLOAD_DIR/m80-release-publication-plan.json" \
            --write

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_receipt.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --token-authority "$UPLOAD_DIR/m80-release-token-authority.json"
          publication_action="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = Path(os.environ["UPLOAD_DIR"]) / "m80-release-publication-plan.json"
          print(json.loads(plan.read_text())["action"])
          PY
          )"
          mapfile -t upload_paths < <(
            scripts/release_upload_manifest.py \
              --dist-dir "$UPLOAD_DIR" \
              --release-tag "$GITHUB_REF_NAME" \
              --print-upload-paths
          )
          case "$publication_action" in
            create_draft_upload_publish)
              gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --draft \
                --title "$GITHUB_REF_NAME" \
                --notes "m80 $GITHUB_REF_NAME release artifacts from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
              gh release upload "$GITHUB_REF_NAME" "${upload_paths[@]}"
              ;;
            validate_existing_public_release)
              echo "release $GITHUB_REF_NAME already public with complete asset metadata; validating remote bytes without upload"
              ;;
            *)
              echo "unsupported release publication action: $publication_action" >&2
              exit 1
              ;;
          esac

      - name: Validate uploaded draft before latest promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          publication_action="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = Path(os.environ["UPLOAD_DIR"]) / "m80-release-publication-plan.json"
          print(json.loads(plan.read_text())["action"])
          PY
          )"
          if [[ "$publication_action" != "create_draft_upload_publish" ]]; then
            echo "no draft pre-promotion validation needed for action: $publication_action"
            exit 0
          fi
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$PREPUBLISH_DIR"
          download_args=(--dir "$PREPUBLISH_DIR")
          while IFS= read -r pattern; do
            download_args+=(--pattern "$pattern")
          done < <(
            scripts/release_upload_manifest.py \
              --dist-dir "$UPLOAD_DIR" \
              --release-tag "$GITHUB_REF_NAME" \
              --print-download-patterns
          )
          gh release download "$GITHUB_REF_NAME" "${download_args[@]}"
          scripts/release_upload_manifest.py \
            --dist-dir "$PREPUBLISH_DIR" \
            --manifest "$UPLOAD_DIR/m80-release-upload-manifest.json" \
            --release-tag "$GITHUB_REF_NAME" \
            --require-exact-dist-public-assets
          scripts/verify-install-handoff.py \
            "$PREPUBLISH_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle "$PREPUBLISH_DIR/m80-release-integrity.attestation.jsonl" \
            --attestation-metadata "$PREPUBLISH_DIR/m80-release-attestation.json" \
            --verification-time "$verification_time"
          scripts/verify-release-bundle.py \
            "$PREPUBLISH_DIR/m80-linux-x86_64.tar.gz" \
            --release-tag "$GITHUB_REF_NAME" \
            --verify-sidecars \
            --downloaded-public-assets
          scripts/verify-release-integrity.py \
            "$PREPUBLISH_DIR/m80-release-integrity.json" \
            --dist-dir "$PREPUBLISH_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle "$PREPUBLISH_DIR/m80-release-integrity.attestation.jsonl" \
            --attestation-metadata "$PREPUBLISH_DIR/m80-release-attestation.json" \
            --verification-time "$verification_time" \
            --rust-toolchain 1.82

      - name: Publish validated draft without latest promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_receipt.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --token-authority "$UPLOAD_DIR/m80-release-token-authority.json"
          publication_action="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = Path(os.environ["UPLOAD_DIR"]) / "m80-release-publication-plan.json"
          print(json.loads(plan.read_text())["action"])
          PY
          )"
          if [[ "$publication_action" != "create_draft_upload_publish" ]]; then
            echo "no draft publish needed for action: $publication_action"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --verify-tag

      - name: Re-download and validate published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$REDOWNLOAD_DIR"
          download_args=(--dir "$REDOWNLOAD_DIR")
          while IFS= read -r pattern; do
            download_args+=(--pattern "$pattern")
          done < <(
            scripts/release_upload_manifest.py \
              --dist-dir "$UPLOAD_DIR" \
              --release-tag "$GITHUB_REF_NAME" \
              --print-download-patterns
          )
          gh release download "$GITHUB_REF_NAME" "${download_args[@]}"
          scripts/release_upload_manifest.py \
            --dist-dir "$REDOWNLOAD_DIR" \
            --manifest "$UPLOAD_DIR/m80-release-upload-manifest.json" \
            --release-tag "$GITHUB_REF_NAME" \
            --require-exact-dist-public-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > "$REDOWNLOAD_DIR/github-release.json"
          release_id="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = Path(os.environ["REDOWNLOAD_DIR"]) / "github-release.json"
          print(json.loads(metadata.read_text())["id"])
          PY
          )"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > "$REDOWNLOAD_DIR/github-release-assets.json"
          scripts/release_remote_asset_inventory.py \
            --redownload-dir "$REDOWNLOAD_DIR" \
            --manifest "$UPLOAD_DIR/m80-release-upload-manifest.json" \
            --release-metadata "$REDOWNLOAD_DIR/github-release.json" \
            --release-assets-metadata "$REDOWNLOAD_DIR/github-release-assets.json" \
            --release-tag "$GITHUB_REF_NAME" \
            --write
          scripts/verify-install-handoff.py \
            "$REDOWNLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle "$REDOWNLOAD_DIR/m80-release-integrity.attestation.jsonl" \
            --attestation-metadata "$REDOWNLOAD_DIR/m80-release-attestation.json" \
            --verification-time "$verification_time"
          python3 scripts/stable_release_channel.py \
            --release-metadata "$REDOWNLOAD_DIR/github-release.json" \
            --asset-index "$REDOWNLOAD_DIR/m80-release-assets.json" \
            --expected-tag "$GITHUB_REF_NAME"
          scripts/verify-release-bundle.py \
            "$REDOWNLOAD_DIR/m80-linux-x86_64.tar.gz" \
            --release-tag "$GITHUB_REF_NAME" \
            --verify-sidecars \
            --downloaded-public-assets
          scripts/verify-release-integrity.py \
            "$REDOWNLOAD_DIR/m80-release-integrity.json" \
            --dist-dir "$REDOWNLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --trust-policy docs/behaviors/release/m80-release-trust-policy.json \
            --attestation-bundle "$REDOWNLOAD_DIR/m80-release-integrity.attestation.jsonl" \
            --attestation-metadata "$REDOWNLOAD_DIR/m80-release-attestation.json" \
            --verification-time "$verification_time" \
            --rust-toolchain 1.82

      - name: Mark validated release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          scripts/release_publish_receipt.py \
            --dist-dir "$UPLOAD_DIR" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit-sha "$RELEASE_COMMIT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            --github-ref "$GITHUB_REF" \
            --token-authority "$UPLOAD_DIR/m80-release-token-authority.json"
          publication_action="$(
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = Path(os.environ["UPLOAD_DIR"]) / "m80-release-publication-plan.json"
          print(json.loads(plan.read_text())["action"])
          PY
          )"
          if [[ "$publication_action" != "create_draft_upload_publish" ]]; then
            echo "no latest promotion needed for action: $publication_action"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --latest --verify-tag

      - name: Write no-auth public-access release readiness receipt
        env:
          RELEASE_COMMIT: ${{ needs.build-release-artifacts.outputs.release_commit }}
        run: |
          set -euo pipefail
          rm -rf "$NOAUTH_GH_DIR"
          mkdir -p "$NOAUTH_GH_DIR"
          verification_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GH_CONFIG_DIR="$NOAUTH_GH_DIR" env -u GH_TOKEN -u GITHUB_TOKEN \
            scripts/release_public_access_receipt.py \
              --repository "$GITHUB_REPOSITORY" \
              --release-tag "$GITHUB_REF_NAME" \
              --commit-sha "$RELEASE_COMMIT" \
              --out "$REDOWNLOAD_DIR/release-readiness-public-access.json" \
              --verification-time "$verification_time" \
              --write

      - name: Upload publish decision receipt
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-publish-decision-${{ github.run_id }}
          path: ${{ steps.publish-scratch.outputs.upload_dir }}/m80-release-publish-decision.json
          if-no-files-found: error

      - name: Upload token authority receipt
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-token-authority-${{ github.run_id }}
          path: ${{ steps.publish-scratch.outputs.upload_dir }}/m80-release-token-authority.json
          if-no-files-found: error

      - name: Upload release publication plan
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-publication-plan-${{ github.run_id }}
          path: ${{ steps.publish-scratch.outputs.upload_dir }}/m80-release-publication-plan.json
          if-no-files-found: error

      - name: Upload remote release asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-remote-assets-${{ github.run_id }}
          path: ${{ steps.publish-scratch.outputs.redownload_dir }}/m80-release-remote-assets.json
          if-no-files-found: error

      - name: Upload public-access release readiness receipt
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-public-access-${{ github.run_id }}
          path: ${{ steps.publish-scratch.outputs.redownload_dir }}/release-readiness-public-access.json
          if-no-files-found: error

      - name: Upload failed publish diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m80-release-publish-failure-${{ github.run_id }}
          path: |
            ${{ steps.publish-scratch.outputs.upload_dir }}/**
            ${{ steps.publish-scratch.outputs.prepublish_dir }}/**
            ${{ steps.publish-scratch.outputs.redownload_dir }}/**
          if-no-files-found: ignore

      - name: Cleanup release publish scratch dirs
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_TMP_ROOT"
