name: Privileged E2E

on:
  workflow_dispatch:
    inputs:
      package:
        description: Rust package to run through scripts/run-e2e.sh
        required: false
        default: m80-firecracker
      timeout_seconds:
        description: Per-test timeout passed to scripts/run-e2e.sh
        required: false
        default: "180"
      run_smoke:
        description: Run scripts/smoke.sh before ignored tests; use "false" only for wrapper debugging
        required: false
        default: "true"
      smoke_mode:
        description: "scripts/smoke.sh mode: full or launch-only"
        required: false
        default: full
      external_network:
        description: Run tests marked requires-external-network with M80_RUN_EXTERNAL_NETWORK_E2E=1
        required: false
        default: "false"
      upload_run_dirs:
        description: Archive the run root when the job fails
        required: false
        default: "true"
      runner_label:
        description: Self-hosted runner label to target; use a unique ephemeral label for disposable L1 runs
        required: false
        default: kvm
      pull_number:
        description: Pull request number whose head ref should be fetched before target_sha checkout
        required: false
        default: ""
      target_sha:
        description: Exact 40-character commit SHA to check out after fetching the public repository or PR ref
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  M80_E2E_PACKAGE: ${{ inputs.package || 'm80-firecracker' }}
  M80_E2E_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '180' }}
  M80_E2E_RUN_SMOKE: ${{ inputs.run_smoke || 'true' }}
  M80_E2E_SMOKE_MODE: ${{ inputs.smoke_mode || 'full' }}
  M80_E2E_EXTERNAL_NETWORK: ${{ inputs.external_network || 'false' }}
  M80_E2E_RUNNER_LABEL: ${{ inputs.runner_label || vars.M80_E2E_RUNNER_LABEL || 'kvm' }}
  M80_E2E_PULL_NUMBER: ${{ inputs.pull_number || '' }}
  M80_E2E_TARGET_SHA: ${{ inputs.target_sha || '' }}
  M80_E2E_RUN_ROOT: ${{ vars.M80_E2E_RUN_ROOT || '/var/lib/m80-r' }}
  M80_RUN_ROOT: ${{ vars.M80_RUN_ROOT || '/var/lib/m80-run' }}
  M80_IMAGE_KIND: ${{ vars.M80_IMAGE_KIND || 'minimal' }}
  M80_ARTIFACT_DIR: ${{ vars.M80_ARTIFACT_DIR || '/tmp/m80-build-current/artifacts' }}
  M80_KERNEL_IMAGE: ${{ vars.M80_KERNEL_IMAGE || '/tmp/m80-build-current/artifacts/vmlinux' }}
  M80_ROOTFS_IMAGE: ${{ vars.M80_ROOTFS_IMAGE || '/tmp/m80-build-current/artifacts/output.ext4' }}
  M80_FIRECRACKER_SECCOMP_FILTER: ${{ vars.M80_FIRECRACKER_SECCOMP_FILTER || '/opt/firecracker/bin/firecracker-seccomp-filter.bin' }}
  M80_BIN: ${{ vars.M80_BIN || '/opt/m80-ci/bin/m80' }}
  M80_JAILER_HARDEN_BIN: ${{ vars.M80_JAILER_HARDEN_BIN || '/opt/m80-ci/bin/m80-jailer-harden' }}
  M80_NET_HELPER_BIN: ${{ vars.M80_NET_HELPER_BIN || '/opt/m80-ci/bin/m80-net-helper' }}

jobs:
  privileged-e2e:
    name: privileged e2e
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label || vars.M80_E2E_RUNNER_LABEL || 'kvm' }}
    timeout-minutes: 180
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )

    steps:
      - name: Checkout public repository
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [[ -n "$M80_E2E_TARGET_SHA" ]]; then
            if ! [[ "$M80_E2E_TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "target_sha must be a full 40-character hex SHA, got $M80_E2E_TARGET_SHA" >&2
              exit 2
            fi
            target_sha="${M80_E2E_TARGET_SHA,,}"
            if [[ -n "$M80_E2E_PULL_NUMBER" ]]; then
              if ! [[ "$M80_E2E_PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "pull_number must be a positive integer when target_sha is set, got $M80_E2E_PULL_NUMBER" >&2
                exit 2
              fi
              git -C "$GITHUB_WORKSPACE" fetch --no-tags --prune --no-recurse-submodules origin \
                "+refs/pull/$M80_E2E_PULL_NUMBER/head:refs/remotes/origin/pr/$M80_E2E_PULL_NUMBER"
            else
              git -C "$GITHUB_WORKSPACE" fetch --no-tags --prune --no-recurse-submodules origin "$target_sha"
            fi
            git -C "$GITHUB_WORKSPACE" checkout --force "$target_sha"
            checked_out_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            if [[ "$checked_out_sha" != "$target_sha" ]]; then
              echo "checked out $checked_out_sha but target_sha requested $target_sha" >&2
              exit 2
            fi
          else
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --prune --no-recurse-submodules origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              "+$GITHUB_REF:refs/remotes/origin/event"
            git -C "$GITHUB_WORKSPACE" checkout --force "$GITHUB_SHA"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate operator inputs
        run: |
          set -euo pipefail
          case "$M80_E2E_RUN_SMOKE" in
            true|false) ;;
            *) echo "run_smoke must be true or false, got $M80_E2E_RUN_SMOKE" >&2; exit 2 ;;
          esac
          case "$M80_E2E_SMOKE_MODE" in
            full|launch-only) ;;
            *) echo "smoke_mode must be full or launch-only, got $M80_E2E_SMOKE_MODE" >&2; exit 2 ;;
          esac
          case "$M80_E2E_EXTERNAL_NETWORK" in
            true|false) ;;
            *) echo "external_network must be true or false, got $M80_E2E_EXTERNAL_NETWORK" >&2; exit 2 ;;
          esac
          case "$M80_IMAGE_KIND" in
            ubuntu|minimal|minimal-erofs) ;;
            *) echo "M80_IMAGE_KIND must be ubuntu|minimal|minimal-erofs, got $M80_IMAGE_KIND" >&2; exit 2 ;;
          esac
          if ! [[ "$M80_E2E_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "timeout_seconds must be a positive integer, got $M80_E2E_TIMEOUT_SECONDS" >&2
            exit 2
          fi
          if ! [[ "$M80_E2E_RUNNER_LABEL" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "runner_label must match [A-Za-z0-9_.-]+, got $M80_E2E_RUNNER_LABEL" >&2
            exit 2
          fi
          if [[ -n "$M80_E2E_TARGET_SHA" ]] && ! [[ "$M80_E2E_TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character hex SHA, got $M80_E2E_TARGET_SHA" >&2
            exit 2
          fi
          if [[ -n "$M80_E2E_PULL_NUMBER" ]] && ! [[ "$M80_E2E_PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull_number must be a positive integer, got $M80_E2E_PULL_NUMBER" >&2
            exit 2
          fi

      - name: Check KVM runner substrate
        run: |
          set -euo pipefail
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            uname -a
            id
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            sudo -n true
            command -v ip
            command -v iptables
            command -v cargo
            command -v rustc
            command -v rg
            command -v unsquashfs
            command -v mkfs.erofs
            if [[ -e /sys/kernel/mm/ksm/run ]]; then
              ksm_run="$(cat /sys/kernel/mm/ksm/run)"
              printf 'KSM_RUN=%s\n' "$ksm_run"
              test "$ksm_run" = "0"
            else
              printf 'KSM_RUN=absent\n'
            fi
            test -f "$M80_KERNEL_IMAGE"
            test -f "$M80_ROOTFS_IMAGE"
            test -f "$M80_FIRECRACKER_SECCOMP_FILTER"
            printf 'M80_E2E_RUN_ROOT=%s\n' "$M80_E2E_RUN_ROOT"
            printf 'M80_E2E_RUNNER_LABEL=%s\n' "$M80_E2E_RUNNER_LABEL"
            printf 'M80_E2E_PULL_NUMBER=%s\n' "$M80_E2E_PULL_NUMBER"
            printf 'M80_E2E_TARGET_SHA=%s\n' "$M80_E2E_TARGET_SHA"
            checked_out_sha="$(git rev-parse HEAD)"
            printf 'M80_E2E_CHECKED_OUT_SHA=%s\n' "$checked_out_sha"
            printf 'M80_E2E_EXTERNAL_NETWORK=%s\n' "$M80_E2E_EXTERNAL_NETWORK"
            printf 'M80_RUN_ROOT=%s\n' "$M80_RUN_ROOT"
            printf 'M80_IMAGE_KIND=%s\n' "$M80_IMAGE_KIND"
            printf 'M80_ARTIFACT_DIR=%s\n' "$M80_ARTIFACT_DIR"
            printf 'M80_KERNEL_IMAGE=%s\n' "$M80_KERNEL_IMAGE"
            printf 'M80_ROOTFS_IMAGE=%s\n' "$M80_ROOTFS_IMAGE"
            printf 'M80_FIRECRACKER_SECCOMP_FILTER=%s\n' "$M80_FIRECRACKER_SECCOMP_FILTER"
            printf 'M80_BIN=%s\n' "$M80_BIN"
            printf 'M80_JAILER_HARDEN_BIN=%s\n' "$M80_JAILER_HARDEN_BIN"
            printf 'M80_NET_HELPER_BIN=%s\n' "$M80_NET_HELPER_BIN"
          } >"$RUNNER_TEMP/m80-e2e-substrate.txt" 2>&1

      - name: Run privileged smoke
        run: |
          set -euo pipefail
          if [[ "$M80_E2E_RUN_SMOKE" == "false" ]]; then
            echo "scripts/smoke.sh skipped by operator input" >"$RUNNER_TEMP/m80-smoke.log"
            exit 0
          fi
          if [[ "$M80_E2E_SMOKE_MODE" == "full" ]]; then
            scripts/smoke.sh >"$RUNNER_TEMP/m80-smoke.log" 2>&1
          else
            scripts/smoke.sh "$M80_E2E_SMOKE_MODE" >"$RUNNER_TEMP/m80-smoke.log" 2>&1
          fi

      - name: Run ignored privileged tests
        run: |
          set -euo pipefail
          status=0
          external_network=0
          if [[ "$M80_E2E_EXTERNAL_NETWORK" == "true" ]]; then
            external_network=1
          fi
          export M80_RUN_EXTERNAL_NETWORK_E2E="$external_network"
          scripts/run-e2e.sh \
            --package "$M80_E2E_PACKAGE" \
            --timeout "$M80_E2E_TIMEOUT_SECONDS" \
            --json \
            >"$RUNNER_TEMP/m80-e2e-report.json" || status=$?
          python3 scripts/validate-e2e-report.py "$RUNNER_TEMP/m80-e2e-report.json"
          python3 - "$RUNNER_TEMP/m80-e2e-report.json" >"$RUNNER_TEMP/m80-e2e-summary.txt" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          summary = report["summary"]
          print(
              "summary: "
              f"pass={summary['passed']} "
              f"fail={summary['failed']} "
              f"skip={summary['skipped']} "
              f"list={summary['listed']} "
              f"total={summary['total']}"
          )
          for item in report["results"]:
              if item["status"] == "fail":
                  print(f"fail: {item['binary']}::{item['test']} reason={item['reason']}")
          PY
          cat "$RUNNER_TEMP/m80-e2e-summary.txt"
          exit "$status"

      - name: Archive failed run root
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.upload_run_dirs != 'false') }}
        run: |
          set -euo pipefail
          if [[ ! -d "$M80_E2E_RUN_ROOT" ]]; then
            echo "run root missing: $M80_E2E_RUN_ROOT" >"$RUNNER_TEMP/m80-e2e-run-root-archive-error.txt"
            exit 0
          fi
          sudo -n tar -C "$M80_E2E_RUN_ROOT" -czf "$RUNNER_TEMP/m80-e2e-run-root.tgz" . \
            2>"$RUNNER_TEMP/m80-e2e-run-root-archive.stderr" || true

      - name: Capture runner diagnostics
        if: always()
        run: |
          set -euo pipefail
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            uname -a
            id
            ls -l /dev/kvm || true
            sudo -n journalctl -n 1000 --no-pager || journalctl -n 1000 --no-pager || true
          } >"$RUNNER_TEMP/m80-e2e-runner-diagnostics.txt" 2>&1

      - name: Upload privileged E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m80-e2e-privileged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m80-e2e-*.json
            ${{ runner.temp }}/m80-e2e-*.txt
            ${{ runner.temp }}/m80-e2e-*.stderr
            ${{ runner.temp }}/m80-smoke.log
            ${{ runner.temp }}/m80-e2e-run-root.tgz
          if-no-files-found: warn
          retention-days: 14
